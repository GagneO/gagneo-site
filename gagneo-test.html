<dialog id="dialog" aria-labelledby="dialog-title"><button class="pill close" aria-label="Fermer">✕</button><h2 id="dialog-title"></h2><p id="dialog-text"></p><div id="dialog-actions"></div></dialog><script>
const dialog=document.querySelector('#dialog');
const dialogActions=document.querySelector('#dialog-actions');
function show(title,message,actions=[]){
  dialog.querySelector('h2').textContent=title;
  dialog.querySelector('p').textContent=message;
  dialogActions.replaceChildren();
  for(const [label,callback] of actions){
    const button=document.createElement('button');
    button.className='pill';
    button.textContent=label;
    button.addEventListener('click',callback);
    dialogActions.append(button);
  }
  if(!dialog.open) dialog.showModal();
}
function go(section){
  if(dialog.open) dialog.close();
  if(section==='accueil') window.scrollTo({top:0,behavior:'smooth'});
  else document.getElementById(section).scrollIntoView({behavior:'smooth'});
}
function offer(name){show(name,'Offre d’exemple pour tester le parcours Bons plans.');}
function mission(name){show(name,'Mission simulée. Tu peux tester l’écran de confirmation.',[['Terminer le test',()=>show('Test terminé','Tu as terminé le parcours de cette mission de démonstration.')]]);}
const screens={
  menu:()=>show('Menu','',['accueil','bons','missions','argent'].map((key,index)=>[['Accueil','Bons plans','Missions','Mon argent'][index],()=>go(key)])),
  notifications:()=>show('Notifications','Aucune notification pour le moment.'),
  profil:()=>show('Profil','Compte de démonstration GAGNEO. Ton espace particulier et professionnel est accessible sur le site principal.',[['Ouvrir GAGNEO',()=>location.assign('https://gagneo.github.io/gagneo-site/')]]),
  parrainage:()=>show('Parrainage','Code de démonstration : GAGNEO-TEST.',[['Tester une invitation',()=>show('Invitation test','Ton invitation de démonstration est prête. Code : GAGNEO-TEST.')]]),
  retrait:()=>show('Retirer mes gains','Gains simulés disponibles : 52,20 €.',[['Simuler le retrait',()=>show('Retrait simulé','Tu as terminé le parcours de retrait de démonstration.')]]),
  offres:()=>show('Bons plans','Choisis une offre de démonstration.',[...document.querySelectorAll('[data-offer]')].map(({dataset:{offer:name}})=>[name,()=>offer(name)])),
  missions:()=>show('Missions rémunérées','Choisis une mission de démonstration.',[...document.querySelectorAll('[data-mission]')].map(({dataset:{mission:name}})=>[name,()=>mission(name)]))
};
document.querySelector('.close').addEventListener('click',()=>dialog.close());
document.querySelectorAll('[data-go]').forEach(button=>button.onclick=()=>go(button.dataset.go));
document.querySelectorAll('[data-open]').forEach(button=>button.onclick=screens[button.dataset.open]);
document.querySelectorAll('[data-offer]').forEach(button=>button.onclick=()=>offer(button.dataset.offer));
document.querySelectorAll('[data-mission]').forEach(button=>button.onclick=()=>mission(button.dataset.mission));
document.querySelector('#eye').onclick=event=>{
  const button=event.currentTarget;
  const hidden=button.getAttribute('aria-pressed')==='false';
  button.setAttribute('aria-pressed',hidden);
  button.setAttribute('aria-label',hidden?'Afficher les montants':'Masquer les montants');
  document.querySelector('.screen').classList.toggle('masked',hidden);
};
</script></body></html>
